name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# El token del workflow solo necesita leer el repo; sin esto hereda los
# permisos por defecto de la configuración del repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # No hay paso de `ruff format`: el código alinea asignaciones y comentarios
      # en columnas a propósito, y el formateador las deshace. `ruff check` sí es
      # obligatorio, y es el que encuentra fallos reales (nombres sin definir,
      # imports muertos, mutables por defecto) en vez de discutir espacios.

      - name: Tests con cobertura
        # -m "not network": las pruebas marcadas salen a internet y dependen de
        # proveedores externos, así que no deben decidir si un PR pasa.
        # El umbral (fail_under) y las exclusiones están en pyproject.toml.
        run: pytest -m "not network" --cov --cov-report=term --cov-report=xml

      # El umbral global (58%) mete en el mismo saco un cliente HTTP y el cálculo
      # de la declaración de la renta. Estos cinco módulos son los que deciden
      # cuánto se declara a Hacienda y cuánto rinde la cartera: un fallo aquí no
      # se ve en pantalla, se ve en el resultado. Se les exige cobertura alta por
      # separado, reutilizando los datos de la ejecución anterior.
      - name: Cobertura de los módulos de cálculo
        run: |
          coverage report --fail-under=90 --show-missing             --include="python/core/fifo.py,python/core/fiscal_es.py,python/core/informe_renta.py,python/core/pnl_divisa.py,python/core/rentabilidad.py,python/core/dinero.py"

      - name: Publicar el informe de cobertura
        # Solo de una versión: tres artefactos idénticos no aportan nada.
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura
          path: coverage.xml
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # js/cartera/assets.js pasa de 4.800 líneas y js/analisis/metricas.js de
      # 4.400. Sin linter, un nombre mal escrito o una variable que ya no existe
      # solo se ve cuando el usuario abre esa pantalla.
      - name: Lint (eslint)
        run: npm run lint

      # Ya no es informativo: el código está formateado y `npm run format` lo
      # mantiene así. A diferencia del de Python, aquí el estilo del proyecto y
      # el del formateador coinciden, así que exigirlo no pelea con nadie.
      - name: Formato (prettier --check)
        run: npm run format:check

      # js/core/ concentra lo que usan todos los demás módulos: el formateo de
      # importes y la capa de acceso a la API. Un fallo ahí no da un error, da un
      # número equivocado en pantalla (`parseEuroNumber("1234.56")` devolvía
      # 123456), que es justo lo que ESLint no puede ver.
      - name: Tests del frontend (vitest)
        run: npm test

  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1

      # Informativo: un aviso publicado hoy no debe bloquear un PR que no lo
      # introdujo. Lo que importa es que aparezca en el resumen del workflow, y
      # que Dependabot (.github/dependabot.yml) abra el PR con la actualización.
      - name: Auditar dependencias de producción
        continue-on-error: true
        run: pip-audit --requirement requirements.txt --desc

      - name: Auditar dependencias de desarrollo
        continue-on-error: true
        run: pip-audit --requirement requirements-dev.txt --desc

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Comprobar que la imagen construye
        run: docker build -t porfoliomanager:ci .

      # Construir no es arrancar. El fallo que motivó estas pruebas —la
      # aplicación se veía pero no guardaba nada— no lo detecta ningún test de
      # Python: solo aparece con los volúmenes montados desde el host, con su
      # propietario, y el contenedor corriendo como otro usuario. Eso es Linux,
      # y es exactamente lo que hay aquí.
      - name: El contenedor arranca y escribe en los volúmenes montados
        run: |
          mkdir -p ci-datos/data ci-datos/logs ci-datos/API
          docker run -d --name pm-ci -p 5050:5050 \
            -e PORT=5050 \
            -e SECRET_KEY=clave-solo-para-ci-0123456789abcdef \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -v "$PWD/ci-datos/data:/app/data" \
            -v "$PWD/ci-datos/logs:/app/logs" \
            -v "$PWD/ci-datos/API:/app/API" \
            porfoliomanager:ci
          sano=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:5050/api/health >/dev/null 2>&1; then sano=1; break; fi
            sleep 2
          done
          docker logs pm-ci
          test "$sano" = 1 || { echo "::error::/api/health no respondió"; exit 1; }
          # La comprobación que faltaba: que lo escrito acabe en el volumen del
          # host y con su usuario, no dentro del contenedor ni a nombre de otro.
          ls -l ci-datos/data/portfolios
          test -n "$(ls ci-datos/data/portfolios/*.db 2>/dev/null)" \
            || { echo "::error::no creó ninguna base de datos en el volumen"; exit 1; }
          propietario=$(stat -c '%u' ci-datos/data/portfolios/*.db | head -n 1)
          test "$propietario" = "$(id -u)" \
            || { echo "::error::los ficheros son del uid $propietario y no del $(id -u) del host"; exit 1; }
          # Y que el arranque deje escrito qué rutas resolvió: es el diagnóstico
          # que se le pide al usuario cuando algo no se guarda.
          docker logs pm-ci 2>&1 | grep -q "\[rutas\]" \
            || { echo "::error::el arranque no registró las rutas de datos"; exit 1; }
          docker rm -f pm-ci

      # El otro lado: cuando de verdad no se puede escribir, el contenedor tiene
      # que pararse y decir por qué, no arrancar y fallar luego en cada guardado.
      - name: Se niega a arrancar si el volumen de datos no es escribible
        run: |
          mkdir -p ci-solo-lectura
          codigo=0
          docker run --name pm-ci-ro \
            -v "$PWD/ci-solo-lectura:/app/data:ro" \
            porfoliomanager:ci || codigo=$?
          docker logs pm-ci-ro 2>&1 | tee salida-ro.txt
          docker rm -f pm-ci-ro
          test "$codigo" -ne 0 || { echo "::error::arrancó con el volumen de solo lectura"; exit 1; }
          grep -q "no se puede escribir" salida-ro.txt \
            || { echo "::error::no explicó que no podía escribir"; exit 1; }
          grep -q "chown" salida-ro.txt \
            || { echo "::error::no indicó cómo arreglarlo"; exit 1; }

      # Informativo, con el mismo criterio que pip-audit: este escaneo no bloquea
      # el PR, solo tiene que verse en el resumen. pip-audit cubre las
      # dependencias de Python, pero no los paquetes del sistema de la imagen
      # base ni los de la imagen de Caddy, que es donde viven los CVE del SO (el
      # de SQLite, los del propio Caddy). Trivy escanea ambas imágenes.
      - name: Instalar Trivy
        # Versión fija y checksum SHA-256 del tarball escrito aquí, no leído de la
        # misma release: si el binario publicado cambia, `sha256sum -c` falla.
        # Antes se ejecutaba install.sh desde la rama main, sin verificar nada.
        env:
          TRIVY_VERSION: "0.76.1"
          TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
        run: |
          curl -sfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          sudo tar -xzf trivy.tar.gz -C /usr/local/bin trivy
          rm trivy.tar.gz
          trivy --version

      # --ignore-unfixed: solo lo que tiene parche disponible, que es lo
      # accionable; un CVE del SO sin fix aún no se puede resolver aquí.
      - name: Escanear la imagen de la aplicación
        continue-on-error: true
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --no-progress porfoliomanager:ci

      - name: Escanear la imagen de Caddy
        continue-on-error: true
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --no-progress caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
