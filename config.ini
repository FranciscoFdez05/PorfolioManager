; ═══════════════════════════════════════════════════════════════════════════════
; Configuración del proyecto
; ═══════════════════════════════════════════════════════════════════════════════
;
; Este fichero es la fuente de verdad de los ajustes de despliegue. El catálogo
; completo (tipos, rangos válidos y variables de entorno) está declarado en
; python/core/settings.py, y ahí es donde hay que añadir un ajuste nuevo.
;
; Prioridad, de mayor a menor:
;   1. Variable de entorno (override puntual; útil en Docker y en los tests).
;   2. Valor de este fichero.
;   3. Valor por defecto declarado en settings.py.
;
; Cada opción está comentada abajo con su valor por defecto entre corchetes y la
; variable de entorno que la sobrescribe. Puedes borrar cualquier línea: se usará
; el valor por defecto. Los valores fuera de rango se recortan al extremo más
; cercano y quedan avisados en el log al arrancar, en vez de tumbar el servidor.
;
; El fichero se relee cuando cambia: editarlo con el servidor arrancado surte
; efecto sin reiniciar, salvo en lo que solo se lee una vez al arrancar (puerto,
; nivel de log, rutas y los ajustes de [gunicorn]).
;
; AQUÍ NO VAN SECRETOS: este fichero está versionado en git. Las claves de API,
; SECRET_KEY y la contraseña de acceso van en .env (ver .env.example) o en
; API/*.key, cifrados en reposo. Las preferencias de la aplicación (tema,
; decimales, moneda base…) se editan desde Ajustes y viven en data/JSON/.


[server]
; Puerto HTTP. Cámbialo solo aquí: con Docker, ./docker-up.sh lee este valor y
; lo exporta como PORT antes de "docker compose up", así el mapeo de puertos y
; el contenedor siempre coinciden con lo que hay en este fichero.
; [5000] · env PORT
port = 5000

; Interfaz de escucha. 0.0.0.0 acepta desde cualquier interfaz (necesario para
; llegar desde otro dispositivo de la LAN); 127.0.0.1 restringe a la máquina.
; [0.0.0.0] · env HOST
host = 0.0.0.0

; Modo debug de Flask. Déjalo en false salvo mientras depuras: expone una
; consola interactiva a quien alcance el puerto.
; [false] · env FLASK_DEBUG
debug = false

; Marca la cookie de sesión como Secure. Actívalo SOLO si hay HTTPS delante: con
; HTTP el navegador descartaría la cookie y no se podría iniciar sesión.
; [false] · env HTTPS_ENABLED
https_activado = false

; SameSite de la cookie de sesión: Lax | Strict | None.
; Strict es más estricto pero cierra la sesión al llegar desde un enlace
; externo. None exige https_activado = true (si no, se degrada a Lax).
; [Lax] · env COOKIE_SAMESITE
cookie_samesite = Lax

; Tamaño máximo de una petición normal, en MB.
; [5] · env MAX_CUERPO_MB
max_cuerpo_mb = 5

; Tamaño máximo en importación y restauración, en MB. Es mucho mayor porque un
; export JSON completo del portfolio ronda los 25 MB: con el tope general
; aplicado también aquí, reimportar un backup propio daba 413.
; [256] · env MAX_SUBIDA_MB
max_subida_mb = 256


[gunicorn]
; Servidor de aplicaciones dentro del contenedor. Estos valores los lee
; entrypoint.sh al arrancar, no el código Python: cambiarlos exige reiniciar el
; contenedor. Fuera de Docker no se usan (ahí manda el servidor de Flask).
;
; workers × threads es la concurrencia total. Con SQLite no compensa subir
; mucho los workers: las escrituras se serializan igualmente sobre el fichero.
; [2] · env GUNICORN_WORKERS
workers = 2
; [4] · env GUNICORN_THREADS
threads = 4
; Segundos antes de matar un worker atascado. [120] · env GUNICORN_TIMEOUT
timeout = 120
; Segundos que se mantiene abierta una conexión ociosa. [5] · env GUNICORN_KEEP_ALIVE
keep_alive = 5


[registros]
; Nivel mínimo de log: CRITICAL | ERROR | WARNING | INFO | DEBUG.
; DEBUG es muy verboso; útil para diagnosticar un problema concreto.
; [INFO] · env LOG_NIVEL
nivel = INFO

; Formato de cada línea (estilo % del módulo logging de Python). Se toma literal:
; no hace falta duplicar los '%'.
; env LOG_FORMATO
formato = %(asctime)s [%(levelname)s] %(name)s - %(message)s


[seguridad]
; Intentos fallidos de login por IP antes de bloquear.
; [8] · env MAX_INTENTOS_LOGIN
max_intentos_login = 8

; Duración del bloqueo tras agotar los intentos, en segundos.
; [300] · env BLOQUEO_SEGUNDOS
bloqueo_segundos = 300

; Tope del registro de intentos que se mantiene en memoria. Evita que crezca sin
; fin si alguien lanza peticiones desde IPs falsificadas.
; [1000] · env MAX_IPS_VIGILADAS
max_ips_vigiladas = 1000

; Iteraciones PBKDF2-SHA256 al hashear la contraseña de acceso. Subirlo endurece
; el hash y encarece el login; solo afecta a las contraseñas que se guarden a
; partir de ese momento, las ya existentes siguen validándose con las suyas.
; [600000] · env HASH_ITERACIONES
hash_iteraciones = 600000

; Peticiones de escritura (POST/PUT/PATCH/DELETE) que se aceptan de una misma IP
; por minuto. No es un antifraude: evita que un bucle del navegador o un cliente
; descontrolado saturen SQLite. Al superarlo se responde 429 con Retry-After.
; 0 desactiva el límite. El contador vive en memoria de cada worker, así que con
; varios workers de Gunicorn el tope real se multiplica por ese número.
; [120] · env ESCRITURAS_POR_MINUTO
escrituras_por_minuto = 120

; Tope aparte, por IP y hora, para las operaciones que copian bases de datos
; enteras (crear backup, restaurar, importar). Son mucho más caras que un POST
; normal, así que el límite general se les queda largo.
; [30] · env ESCRITURAS_PESADAS_POR_HORA
escrituras_pesadas_por_hora = 30

; Cabecera Content-Security-Policy. Limita de dónde puede cargar scripts y
; estilos el navegador, de modo que un HTML inyectado no pueda traerse código de
; un dominio ajeno. Desactívala solo para depurar.
; [true] · env CSP_ACTIVADA
csp_activada = true

; Orígenes externos que se permiten en script-src, separados por coma. Vacío
; por defecto: Chart.js se sirve desde js/vendor/, así que la política queda
; cerrada a 'self' y la aplicación no depende de ningún CDN para funcionar.
; Rellénalo solo si añades una librería externa, y añade también su `integrity`.
; [vacío] · env CSP_ORIGENES_SCRIPTS
csp_origenes_scripts =


[atajo]
; Alta rápida de gastos e ingresos desde el Atajo de iOS (POST /api/movimiento).
; Es un extra: la web app sigue funcionando igual con esto desactivado.
; En false, los endpoints responden 404 como si no existieran.
; [true] · env MOVIMIENTOS_ACTIVADO
activado = true

; Redes desde las que se aceptan estas peticiones, en CIDR separados por coma.
; Ajusta el segundo rango al "Address" de tu interfaz wg0 de WireGuard.
; Si se deja vacío no se acepta a nadie: nunca significa "todos".
; [192.168.1.0/24, 10.0.0.0/24] · env MOVIMIENTOS_REDES_PERMITIDAS
redes_permitidas = 192.168.1.0/24, 10.0.0.0/24

; Margen máximo, en segundos, entre el X-Timestamp de la petición y el reloj del
; servidor. Cuanto más bajo, más estrecha la ventana para reenviar una petición
; capturada; demasiado bajo y un desfase de reloj normal empieza a dar 401.
; [60] · env MOVIMIENTOS_TOLERANCIA_SEGUNDOS
tolerancia_segundos = 60

; Tope de caracteres que /api/firmar acepta firmar de una vez.
; [8192] · env MOVIMIENTOS_MAX_TEXTO_FIRMA
max_texto_firma = 8192

; Fichero con la clave de la firma HMAC. Ruta relativa a la raíz del proyecto.
; API/ está en .gitignore y su contenido se cifra en reposo con SECRET_KEY,
; igual que las claves de los proveedores de cotizaciones. La clave NO va aquí:
; config.ini sí está versionado en git.
; Genera el fichero con: python tools/generar_clave_movimientos.py
; [API/movimientos.key] · env MOVIMIENTOS_FICHERO_CLAVE
fichero_clave = API/movimientos.key


[backups]
; Backups diarios automáticos que se conservan por portfolio antes de rotar.
; [14] · env BACKUPS_MAX_COPIAS
max_copias = 14

; Segundos que se espera por el lock de SQLite al copiar o reparar una BD. Más
; alto que el de uso normal porque copiar una BD grande tarda más.
; [15] · env BACKUPS_SQLITE_TIMEOUT
sqlite_timeout_segundos = 15


[base_datos]
; Segundos que espera sqlite3.connect por el fichero de la BD.
; [10] · env DB_TIMEOUT
timeout_segundos = 10

; PRAGMA busy_timeout: milisegundos que SQLite reintenta antes de responder
; "database is locked". Súbelo si ves ese error con varias pestañas abiertas.
; [5000] · env DB_BUSY_TIMEOUT_MS
busy_timeout_ms = 5000


[mercado]
; Vida de la caché del histórico de precios, en segundos. 0 desactiva la caché
; (cada consulta va al proveedor y gasta cuota).
; [14400] (4 horas) · env MERCADO_HISTORICO_TTL
historico_ttl_segundos = 14400

; Cotizaciones que se piden a la vez al refrescar. Subirlo acelera el refresco
; con muchos activos, pero agota antes la cuota y aumenta los 429.
; [6] · env MERCADO_MAX_PARALELAS
max_peticiones_paralelas = 6

; Suelo del intervalo entre snapshots del portfolio, en segundos. El intervalo
; real se elige en Ajustes; esto solo impide que un valor demasiado bajo llene
; la tabla de snapshots.
; [60] · env MERCADO_SNAPSHOT_MIN
snapshot_intervalo_minimo_segundos = 60

; Hilo del servidor que guarda los snapshots aunque no haya ninguna pestaña
; abierta. Con esto apagado el histórico vuelve a depender del navegador: si no
; abres la web durante una semana, esa semana no existe en el gráfico y la
; rentabilidad anual (Modified Dietz) se calcula con huecos.
; El intervalo y el alcance (solo el portfolio activo o todos) se eligen en
; Ajustes → Evolución del portfolio.
; [true] · env MERCADO_SNAPSHOT_SERVIDOR
snapshot_servidor = true

; Margen, en segundos, que ese hilo espera tras cada hueco horario antes de
; ponerse a valorar. Si hay una pestaña abierta, en ese margen guarda ella el
; punto con los precios que ya tiene en pantalla y el servidor se lo salta, así
; que las cotizaciones no se piden dos veces. Se limita a un cuarto del
; intervalo, para que con intervalos cortos no se coma el hueco entero.
; [120] · env MERCADO_SNAPSHOT_GRACIA
snapshot_servidor_gracia_segundos = 120


[proveedores]
; Parámetros de red comunes a Finnhub, EODHD, Yahoo y Alpha Vantage.

; Timeout por intento, en segundos. [10] · env PROVEEDORES_TIMEOUT
timeout_segundos = 10

; Reintentos tras un fallo transitorio (timeout, corte de red, 5xx, 429).
; 0 desactiva los reintentos. [2] · env PROVEEDORES_REINTENTOS
reintentos = 2

; Espera entre reintentos: exponencial con jitter, partiendo del backoff inicial
; y sin pasar del máximo. Evita que varios activos reintenten a la vez y
; vuelvan a saturar al proveedor.
; [0.4] · env PROVEEDORES_BACKOFF
backoff_inicial_segundos = 0.4
; [4.0] · env PROVEEDORES_BACKOFF_MAX
backoff_maximo_segundos = 4.0

; Tope al Retry-After que pida el proveedor. Los planes gratuitos llegan a pedir
; 60 s y hay un usuario esperando delante de la pantalla.
; [5.0] · env PROVEEDORES_MAX_RETRY_AFTER
max_retry_after_segundos = 5.0

; Tamaño máximo de una respuesta, en MB. El mayor payload legítimo son los
; catálogos de símbolos de Finnhub (unos 2 MB). Protege la memoria del proceso.
; [8] · env PROVEEDORES_MAX_RESPUESTA_MB
max_respuesta_mb = 8

; User-Agent con el que se identifica el cliente. (El cliente de Yahoo usa uno
; de navegador aparte: ese proveedor rechaza los demás.)
; [PortfolioPython/1.0] · env PROVEEDORES_USER_AGENT
user_agent = PortfolioPython/1.0


[rutas]
; Directorios de datos. Relativos a la raíz del proyecto, o absolutos si quieres
; sacarlos de ahí (un volumen persistente, otro disco, un NAS…). Se leen solo al
; arrancar: cambiarlos exige reiniciar.
;
; Con Docker, si cambias esto, ajusta también los volúmenes de
; docker-compose.yml para que apunten al mismo sitio.

; Bases de datos, JSON de configuración y backups. [data] · env PORTFOLIO_DATA_DIR
datos = data

; Ficheros de log. [logs] · env PORTFOLIO_LOGS_DIR
logs = logs

; Claves de API cifradas. [API] · env PORTFOLIO_API_DIR
claves = API
