<section class="operationsPage operationsPageCompact stablecoinsPage">
    <div class="stablecoinsToolbar">
        <div class="overviewSearch tablaBusqueda" data-busca-en="#stablecoinsBody">
            <button class="overviewSearchBtn" type="button" aria-label="Buscar en la tabla" title="Buscar en la tabla">
                <span class="icono iconoBuscar" aria-hidden="true"></span>
            </button>
            <input type="text" class="overviewSearchInput" aria-label="Buscar en la tabla" placeholder="Buscar..." autocomplete="off" spellcheck="false" hidden>
        </div>
        <div class="overviewDivider tablaBusquedaDivisor"></div>
        <div id="stablecoinsEnabledMenu" class="stablecoinsEnabledMenu"></div>
        <div class="stablecoinsToolbarRight">
            <button id="addStablecoinRowBtn" class="primaryButton" type="button">Añadir compra</button>
            <div class="interesesMenuWrapper">
                <button class="interesesMenuBtn" id="stablecoinsMenuBtn" type="button" title="Acciones">···</button>
                <div class="interesesMenuDropdown hidden" id="stablecoinsMenuDropdown">
                    <button id="openStablecoinModalBtn" class="interesesMenuOption" type="button">+ Añadir stablecoin</button>
                    <button id="saveStablecoinsBtn" class="interesesMenuOption" type="button">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="stablecoinsSummary" class="stablecoinsSummary"></div>

    <div class="operationsTableWrapper stablecoinsTableWrapper" id="stablecoinsTableWrapper">
        <table class="operationsTable stablecoinsTable">
            <thead>
                <tr>
                    <th class="mThSort" data-sortkey="0">Stablecoin<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="1">Fecha<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="2">Cantidad<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="3">Pagado en<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="4">Precio unitario<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="5">Total pagado<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="6">Comisiones<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="7">Nota<span class="mSortArrow"></span></th>
                    <th class="rowActionsCell"></th>
                </tr>
            </thead>
            <tbody id="stablecoinsBody"></tbody>
        </table>
    </div>
    <p class="overviewEmpty hidden" id="stablecoinsEmptyMsg">No hay compras de stablecoins.</p>
</section>

<div class="modalOverlay hidden" id="stablecoinModalOverlay">
    <div class="assetModal stablecoinModal" role="dialog" aria-modal="true" aria-labelledby="stablecoinModalTitle">
        <h3 class="assetModalTitle" id="stablecoinModalTitle">Añadir stablecoin</h3>
        <label class="assetModalLabel" for="stablecoinSearchInput">Nombre o ticker en Finnhub</label>
        <input id="stablecoinSearchInput" class="assetModalInput" type="text" placeholder="Ej: USDT o Tether">
        <div class="assetModalActions stablecoinModalActions">
            <button id="stablecoinSearchBtn" class="primaryButton" type="button">Buscar</button>
            <button id="closeStablecoinModalBtn" class="secondaryButton" type="button">Cerrar</button>
        </div>
        <p id="stablecoinSearchFeedback" class="assetSearchFeedback hidden"></p>
        <div id="stablecoinSearchResults" class="assetSearchResults hidden"></div>
    </div>
</div>
