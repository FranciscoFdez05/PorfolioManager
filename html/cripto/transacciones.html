<section class="operationsPage operationsPageCompact transaccionesPageCompact">
    <div class="transaccionesToolbar">
        <div class="overviewSearch tablaBusqueda" data-busca-en="#transaccionesBody">
            <button class="overviewSearchBtn" type="button" aria-label="Buscar en la tabla" title="Buscar en la tabla">
                <span class="icono iconoBuscar" aria-hidden="true"></span>
            </button>
            <input type="text" class="overviewSearchInput" aria-label="Buscar en la tabla" placeholder="Buscar..." autocomplete="off" spellcheck="false" hidden>
        </div>
        <div class="overviewDivider tablaBusquedaDivisor"></div>
        <div id="transaccionesAssetMenu" class="transaccionesFilters"></div>
        <div class="transaccionesToolbarRight">
            <div class="pageActionsMenu" id="transaccionesActionsMenu">
                <button class="pageActionsMenuTrigger" type="button" aria-label="Opciones" aria-haspopup="true">···</button>
                <div class="pageActionsDropdown" id="transaccionesActionsDropdown">
                    <button id="transaccionesSincronizarBtn" class="pageActionsItem" type="button" title="Lee la red e importa aquí los movimientos nuevos de todas tus wallets">Sincronizar</button>
                    <button id="transaccionesGrafoBtn" class="pageActionsItem" type="button">Ver movimientos en gráfico</button>
                    <button id="transaccionesWalletsBtn" class="pageActionsItem" type="button">Wallets enlazadas</button>
                    <button id="saveTransaccionesBtn" class="pageActionsItem" type="button">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="operationsTableWrapper" id="transaccionesTableWrapper">
        <table class="operationsTable">
            <thead>
                <tr>
                    <th class="mThSort" data-sortkey="0">Cripto<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="1">Fecha operación<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="2">Total cripto<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="3">Comisión<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="4">Wallet<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="5">Wallet origen<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="6">Wallet destino<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="7">Hash transacción<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="8">Nota<span class="mSortArrow"></span></th>
                    <th class="rowActionsCell"></th>
                </tr>
            </thead>
            <tbody id="transaccionesBody"></tbody>
        </table>
    </div>
    <p class="overviewEmpty hidden" id="transaccionesNoAssetMsg">No hay criptos creadas en Activos para registrar transacciones.</p>
    <p class="overviewEmpty hidden" id="transaccionesEmptyMsg">No hay transacciones. Se importan de la blockchain: enlaza una wallet y sincronízala desde el menú ···.</p>

</section>
