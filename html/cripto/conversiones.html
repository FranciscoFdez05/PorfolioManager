<section class="toolsPage">
    <div class="toolsHero">
        <div class="toolsAssetPicker">
            <label class="toolsLabel" for="conversionesAssetSelect">Activo</label>
            <select id="conversionesAssetSelect" class="operationsSelect toolsAssetSelect"></select>
        </div>
        <div class="toolsSelectedAsset" id="conversionesSelectedAsset">
            <div class="toolsSelectedLabel">Conversiones</div>
            <div class="toolsSelectedValue">Selecciona un activo</div>
        </div>
    </div>

    <div class="cvStatsRow hidden" id="cvStatsRow">
        <div class="cvStatCard">
            <div class="cvStatLabel">Total conversiones</div>
            <div class="cvStatValue" id="cvStatTotal">—</div>
        </div>
        <div class="cvStatCard">
            <div class="cvStatLabel">Recibido</div>
            <div class="cvStatValue cvStatPos" id="cvStatIn">—</div>
        </div>
        <div class="cvStatCard">
            <div class="cvStatLabel">Enviado</div>
            <div class="cvStatValue cvStatNeg" id="cvStatOut">—</div>
        </div>
        <div class="cvStatCard">
            <div class="cvStatLabel">Balance neto</div>
            <div class="cvStatValue" id="cvStatNet">—</div>
        </div>
    </div>

    <div class="conversionesTableWrapper">
        <table class="operationsTable conversionesTable">
            <thead>
                <tr>
                    <th class="mThSort" data-sortkey="0">Fecha<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="1">Par<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="2">Tipo<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="3">Cantidad<span class="mSortArrow"></span></th>
                    <th class="rowActionsCell"></th>
                </tr>
            </thead>
            <tbody id="conversionesBody"></tbody>
        </table>
    </div>
    <p class="overviewEmpty hidden" id="conversionesEmptyMsg">No hay conversiones registradas.</p>

</section>

<div class="operationsActions">
    <button id="addConversionRowBtn" class="primaryButton" type="button">Añadir fila</button>
</div>
