<section class="gastosPage">
    <div class="gastosYearBar">
        <div class="gastosYearList" id="gastosYearList"></div>
        <div class="pageActionsMenu" id="gastosActionsMenu">
            <button class="pageActionsMenuTrigger" type="button" aria-label="Opciones" aria-haspopup="true">···</button>
            <div class="pageActionsDropdown" id="gastosActionsDropdown">
                <button id="addGastosYearBtn" class="pageActionsItem" type="button">Añadir año</button>
                <button id="deleteGastosYearBtn" class="pageActionsItem pageActionsItemDanger" type="button">Eliminar año</button>
                <div class="pageActionsDivider"></div>
                <button id="addGastoTypeRowBtn" class="pageActionsItem" type="button">Añadir gasto</button>
                <button id="addMensualidadRowBtn" class="pageActionsItem" type="button">Añadir mensualidad</button>
            </div>
        </div>
    </div>

    <div class="gastosMonthBar">
        <div class="gastosMonthTabs" id="gastosMonthTabs"></div>
        <div class="gastosMonthBarSpacer"></div>
    </div>

    <div class="gastosAnnualWrapper" id="gastosAnnualWrapper">
        <table class="gastosAnnualTable">
            <thead>
                <tr>
                    <th id="gastosAnnualYearLabel">2026</th>
                    <th>Enero</th>
                    <th>Febrero</th>
                    <th>Marzo</th>
                    <th>Abril</th>
                    <th>Mayo</th>
                    <th>Junio</th>
                    <th>Julio</th>
                    <th>Agosto</th>
                    <th>Septiembre</th>
                    <th>Octubre</th>
                    <th>Noviembre</th>
                    <th>Diciembre</th>
                    <th class="rowActionHeader"></th>
                </tr>
            </thead>
            <tbody id="gastosAnnualBody"></tbody>
        </table>
    </div>

    <div class="gastosMonthHeader hidden" id="gastosMonthHeader"></div>

    <div class="gastosMovementsWrapper hidden" id="gastosMovementsWrapper">
        <table class="gastosMovementsTable">
            <thead>
                <tr>
                    <th class="mThSort" data-sortkey="0">Fecha<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="1">Nombre<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="2">Tipo<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="3">Cantidad<span class="mSortArrow"></span></th>
                    <th class="rowActionHeader"></th>
                </tr>
            </thead>
            <tbody id="gastosMovementsBody"></tbody>
        </table>
    </div>

    <div class="gastosActions hidden" id="gastosActions">
        <button id="addGastoRowBtn" class="primaryButton" type="button">Añadir fila</button>
    </div>
</section>
