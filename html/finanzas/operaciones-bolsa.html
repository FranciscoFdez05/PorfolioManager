<section class="operationsPage operationsPageCompact">
    <div class="operationsToolbar">
        <div class="operationsToolbarLeft">
            <div class="overviewSearch" id="operationsSearchBox">
                <button class="overviewSearchBtn" id="operationsSearchBtn" type="button" aria-label="Buscar operacion" title="Buscar operacion">
                    <span class="icono iconoBuscar" aria-hidden="true"></span>
                </button>
                <input type="text" class="overviewSearchInput" id="operationsSearch" aria-label="Buscar operacion" placeholder="Buscar activo o par..." autocomplete="off" spellcheck="false" hidden>
            </div>
            <div class="overviewDivider"></div>
            <div class="operationsFilters">
                <div class="operationsFilterButtons" id="operationsTypeFilters">
                    <label class="overviewFilterOption operationsFilterOption">
                        <input type="checkbox" value="Compra" data-filter-group="type" checked>
                        <span>Compra</span>
                    </label>
                    <label class="overviewFilterOption operationsFilterOption">
                        <input type="checkbox" value="Venta" data-filter-group="type" checked>
                        <span>Venta</span>
                    </label>
                </div>
                <div class="overviewDivider"></div>
                <div class="operationsFilterButtons" id="operationsStatusFilters">
                    <label class="overviewFilterOption operationsFilterOption">
                        <input type="checkbox" value="Activo" data-filter-group="status" checked>
                        <span>Activo</span>
                    </label>
                    <label class="overviewFilterOption operationsFilterOption">
                        <input type="checkbox" value="Completado" data-filter-group="status" checked>
                        <span>Completado</span>
                    </label>
                    <label class="overviewFilterOption operationsFilterOption">
                        <input type="checkbox" value="Cancelado" data-filter-group="status" checked>
                        <span>Cancelado</span>
                    </label>
                </div>
            </div>
        </div>
        <div class="operationsToolbarRight">
            <div id="operationsPairsSummary" class="operationsPairsSummary hidden"></div>
            <button id="addOperationRowBtn" class="primaryButton" type="button">Añadir operación</button>
            <button id="saveOperationsBtn" class="secondaryButton" type="button">Guardar</button>
        </div>
    </div>

    <div class="operationsTableWrapper">
        <table class="operationsTable cryptoOperationsTable">
            <thead>
                <tr>
                    <th class="mThSort" data-sortkey="0">Activo<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="1">Fecha Apertura<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="2">Par<span class="mSortArrow"></span></th>
                    <th class="mThSort operationsTickerHeader" data-sortkey="3">Precio Actual<span class="mSortArrow"></span></th>
                    <th class="mThSort operationsRecorridoHeader" data-sortkey="4">Recorrido<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="5">Orden<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="6">Precio Orden<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="7">Cantidad<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="8">Total<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="9">Comisiones €<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="10">Estado<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="11">Fecha Cierre<span class="mSortArrow"></span></th>
                    <th class="rowActionsCell"></th>
                </tr>
            </thead>
            <tbody id="operationsBody"></tbody>
        </table>
    </div>
    <p class="overviewEmpty hidden" id="operacionesEmptyMsg">No hay operaciones registradas.</p>
</section>
