<div class="bonosPage">

    <div class="bonosToolbar">
        <div class="bonosToolbarLeft">
            <div class="overviewSearch" id="bonosSearchBox">
                <button class="overviewSearchBtn" id="bonosSearchBtn" type="button" aria-label="Buscar bono" title="Buscar bono">
                    <span class="icono iconoBuscar" aria-hidden="true"></span>
                </button>
                <input type="text" class="overviewSearchInput" id="bonosSearch" aria-label="Buscar bono" placeholder="Buscar instrumento..." autocomplete="off" spellcheck="false" hidden>
            </div>
            <div class="overviewDivider"></div>
            <div class="bonosFilters" id="bonosFilters">
                <label class="bonosFilterBtn" data-tipo="all"><input type="checkbox" checked><span>Todos</span></label>
                <label class="bonosFilterBtn" data-tipo="if"><input type="checkbox" checked><span>Interés Fijo</span></label>
                <label class="bonosFilterBtn" data-tipo="corporativo"><input type="checkbox" checked><span>Corporativos</span></label>
                <label class="bonosFilterBtn" data-tipo="gubernamental"><input type="checkbox" checked><span>Gubernamentales</span></label>
            </div>
        </div>
        <div class="bonosToolbarRight">
            <button id="bonosAddBtn" class="primaryButton">Añadir bono</button>
            <button id="saveBonosBtn" class="primaryButton">Guardar</button>
        </div>
    </div>

    <div class="bonosSummary">
        <div class="bonosSummaryCard">
            <span class="bonosSummaryLabel">Total neto</span>
            <span class="bonosSummaryValue" id="bonosTotalNeto">0,00 €</span>
        </div>
        <div class="bonosSummaryCard">
            <span class="bonosSummaryLabel">Interés acumulado</span>
            <span class="bonosSummaryValue" id="bonosTotalInteres">0,00 €</span>
        </div>
        <div class="bonosSummaryCard">
            <span class="bonosSummaryLabel">Impuestos</span>
            <span class="bonosSummaryValue" id="bonosTotalImpuestos">0,00 €</span>
        </div>
        <div class="bonosSummaryCard">
            <span class="bonosSummaryLabel">Invertido total</span>
            <span class="bonosSummaryValue" id="bonosTotalInvertido">0,00 €</span>
        </div>
        <div class="bonosSummaryCard bonosSummaryGub">
            <span class="bonosSummaryLabel">Interés Fijo neto</span>
            <span class="bonosSummaryValue" id="bonosTotalIf">0,00 €</span>
        </div>
        <div class="bonosSummaryCard">
            <span class="bonosSummaryLabel">Corporativos neto</span>
            <span class="bonosSummaryValue" id="bonosTotalCorp">0,00 €</span>
        </div>
        <div class="bonosSummaryCard bonosSummaryCorp">
            <span class="bonosSummaryLabel">Gubernamentales neto</span>
            <span class="bonosSummaryValue" id="bonosTotalGub">0,00 €</span>
        </div>
    </div>

    <div class="bonosTableWrapper" id="bonosTableWrapper">
        <table class="bonosTable">
            <thead>
                <tr>
                    <th class="mThSort" data-sortkey="0">Fecha<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="1">Tipo<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="2">Moneda<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="3">Instrumento<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="4">Cupón / Rend. %<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="5">Vencimiento<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="6">Invertido<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="7">Interés acum.<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="8">Impuestos<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="9">Total neto<span class="mSortArrow"></span></th>
                    <th class="rowActionsCell"></th>
                </tr>
            </thead>
            <tbody id="bonosBody"></tbody>
        </table>
    </div>

    <p class="overviewEmpty hidden" id="bonosEmptyMsg">No hay bonos registrados.</p>

</div>
