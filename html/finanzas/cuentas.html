<section class="cuentasPage">
    <div class="cuentasTopBar">
        <div class="cuentasKpis">
            <div
                class="cuentasKpi"
                title="Suma de todas las cuentas a día de hoy. La bancaria incluye lo apuntado en Gastos e Ingresos."
            >
                <span class="cuentasKpiTitulo">Total en cuentas</span>
                <span class="cuentasKpiValor" id="cuentasTotal">—</span>
            </div>
            <div class="cuentasKpi" title="Cuánto ha cambiado el total desde el 1 de enero.">
                <span class="cuentasKpiTitulo">Variación en el año</span>
                <span class="cuentasKpiValor" id="cuentasVariacion">—</span>
            </div>
            <div
                class="cuentasKpi"
                title="Suma de las comisiones de las transferencias. Van aparte del importe: la cuenta de destino recibe la cantidad entera."
            >
                <span class="cuentasKpiTitulo">Comisiones pagadas</span>
                <span class="cuentasKpiValor cuentasNeg" id="cuentasComisiones">—</span>
            </div>
            <div class="cuentasKpi">
                <span class="cuentasKpiTitulo">Cuentas</span>
                <span class="cuentasKpiValor" id="cuentasNumero">—</span>
            </div>
        </div>
        <div class="pageActionsMenu" id="cuentasActionsMenu">
            <button class="pageActionsMenuTrigger" type="button" aria-label="Opciones" aria-haspopup="true">···</button>
            <div class="pageActionsDropdown" id="cuentasActionsDropdown">
                <button id="cuentasNuevaCuentaBtn" class="pageActionsItem" type="button">Nueva cuenta</button>
                <button id="cuentasGrafoBtn" class="pageActionsItem" type="button">Ver movimientos en gráfico</button>
                <button id="cuentasCsvBtn" class="pageActionsItem" type="button">Descargar CSV</button>
                <button id="cuentasInformeBtn" class="pageActionsItem" type="button">Descargar informe (PDF)</button>
            </div>
        </div>
    </div>

    <div class="cuentasLayout">
        <div class="cuentasLista" id="cuentasLista"></div>

        <aside class="cuentasSide">
            <section class="cntTotalCard" id="cuentasLateral">
                <div id="cuentasLateralTabs"></div>
                <div class="cntTotalCab">
                    <h3 class="cntTotalTitulo" id="cuentasLateralTitulo"></h3>
                    <div class="cntLateralSub" id="cuentasLateralSub"></div>
                </div>
                <div id="cuentasTotalRangos"></div>
                <div class="cntGraficaCaja cntTotalGraficaCaja">
                    <canvas id="cuentasTotalGrafica" aria-label="Gráfico de las cuentas"></canvas>
                    <div class="cntDonutCentro" id="cuentasLateralCentro" aria-hidden="true" hidden>
                        <span class="cntDonutCentroValor"></span>
                        <span class="cntDonutCentroTitulo"></span>
                        <span class="cntDonutCentroPct"></span>
                    </div>
                </div>
                <p class="overviewEmpty hidden" id="cuentasTotalVacio"></p>
                <ul class="cntLeyenda" id="cuentasLateralLeyenda"></ul>
            </section>
        </aside>
    </div>
</section>
