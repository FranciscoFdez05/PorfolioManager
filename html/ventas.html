<section class="operationsPage ventasPageExpanded">
    <div class="gastosYearBar">
        <div class="gastosYearList" id="ventasYearList"></div>
        <div class="gastosYearActions">
            <button id="deleteVentasYearBtn" class="dangerButton" type="button">Eliminar año</button>
            <button id="addVentasYearBtn" class="gastosAddYearBtn" type="button">+</button>
        </div>
    </div>

    <div class="operationsTableWrapper">
        <table class="operationsTable">
            <thead>
                <tr>
                    <th class="mThSort" data-sortkey="0">Fecha Venta<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="1">Activo<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="2">Cantidad<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="3">Coste FIFO unitario<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="4">Valor de venta<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="5">Dinero a declarar<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="6">Tramo 1 (19%)<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="7">Tramo 2 (21%)<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="8">Tramo 3 (23%)<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="9">Tramo 4 (27%)<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="10">Tramo 5 (28%)<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="11">Total a pagar<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="12">Bruto<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="13">Neto<span class="mSortArrow"></span></th>
                    <th class="rowActionHeader"></th>
                </tr>
            </thead>
            <tbody id="ventasBody"></tbody>
        </table>
    </div>

    <div class="operationsActions">
        <button id="addVentaRowBtn" class="primaryButton" type="button">Añadir fila</button>
    </div>
</section>
