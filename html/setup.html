<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Manager — Configuración inicial</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            background:#0b1120;
            color:#e5edf9;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .loginCard{
            background:#0f1724;
            border:1px solid #1e2d45;
            border-radius:14px;
            padding:40px 36px 36px;
            width:100%;
            max-width:360px;
            box-shadow:0 8px 40px rgba(0,0,0,.45);
        }
        .loginTitle{
            font-size:1.3rem;
            font-weight:600;
            color:#ccd6f6;
            margin-bottom:8px;
            text-align:center;
            letter-spacing:.3px;
        }
        .loginTitle span{
            color:#3b82f6;
        }
        .loginSubtitle{
            font-size:0.82rem;
            color:#64748b;
            text-align:center;
            margin-bottom:28px;
            line-height:1.5;
        }
        label{
            display:block;
            font-size:0.78rem;
            color:#94a3b8;
            margin-bottom:6px;
            text-transform:uppercase;
            letter-spacing:.6px;
        }
        input{
            width:100%;
            padding:10px 13px;
            background:#111827;
            border:1px solid #273246;
            border-radius:8px;
            color:#e5edf9;
            font-size:0.9rem;
            outline:none;
            transition:border-color .15s;
            margin-bottom:18px;
        }
        input:focus{border-color:#3b82f6}
        button[type=submit]{
            width:100%;
            padding:11px;
            background:#3b82f6;
            color:#fff;
            border:none;
            border-radius:8px;
            font-size:0.95rem;
            font-weight:600;
            cursor:pointer;
            transition:background .15s;
            margin-top:4px;
        }
        button[type=submit]:hover{background:#1d4ed8}
        .loginError{
            background:rgba(231,76,60,.15);
            border:1px solid rgba(231,76,60,.4);
            color:#e74c3c;
            border-radius:8px;
            padding:9px 12px;
            font-size:0.84rem;
            margin-bottom:18px;
            text-align:center;
        }
    </style>
</head>
<body>
<div class="loginCard">
    <p class="loginTitle">Portfolio <span>Manager</span></p>
    <p class="loginSubtitle">Primera configuración. Crea las credenciales de acceso.</p>
    <!-- ERROR_PLACEHOLDER -->
    <form method="POST">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" autofocus required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required>
        <label for="password2">Repite la contraseña</label>
        <input id="password2" name="password2" type="password" autocomplete="new-password" required>
        <button type="submit">Crear acceso</button>
    </form>
</div>
</body>
</html>
