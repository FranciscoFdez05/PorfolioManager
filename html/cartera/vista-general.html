<section class="overviewPage">
    <div class="overviewFiltersBar">
        <div class="overviewScroll">
        <div class="overviewFilters" id="overviewFilters">
            <div class="overviewSearch" id="overviewSearch">
                <button class="overviewSearchBtn" id="overviewSearchBtn" type="button" aria-label="Buscar activo" title="Buscar activo">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
                </button>
                <input class="overviewSearchInput" id="overviewSearchInput" type="text" placeholder="Buscar por nombre…" autocomplete="off" spellcheck="false" hidden>
            </div>
            <div class="overviewDivider"></div>
            <label class="overviewFilterOption overviewFilterTodos">
                <input type="checkbox" value="todos" checked>
                <span>Todos</span>
            </label>
            <label class="overviewFilterOption">
                <input type="checkbox" value="cripto" checked>
                <span>Cripto</span>
            </label>
            <label class="overviewFilterOption">
                <input type="checkbox" value="acciones" checked>
                <span>Acciones</span>
            </label>
            <label class="overviewFilterOption">
                <input type="checkbox" value="etfs" checked>
                <span>ETFs</span>
            </label>
            <label class="overviewFilterOption">
                <input type="checkbox" value="comoditis" checked>
                <span>Comoditis</span>
            </label>
        </div>

        <div class="overviewDivider"></div>

        <div class="overviewExtremes" id="overviewExtremes">
            <div class="overviewExtremeCard" id="overviewRealizedCard"></div>
            <div class="overviewExtremeCard" id="overviewBestCard"></div>
            <div class="overviewExtremeCard" id="overviewWorstCard"></div>
        </div>
        </div>

        <!-- <button id="refreshOverviewMarketBtn" class="primaryButton" type="button">Actualizar cotizaciones</button> -->
        <div class="overviewActionsGroup">
            <div class="pageActionsMenu" id="overviewActionsMenu">
                <button class="pageActionsMenuTrigger" type="button" aria-label="Opciones" aria-haspopup="true">···</button>
                <div class="pageActionsDropdown" id="overviewActionsDropdown">
                    <button type="button" id="overviewShowHiddenBtn" class="pageActionsItem" title="Mostrar u ocultar los activos ocultos">Mostrar ocultos</button>
                    <div class="pageActionsDivider"></div>
                    <button type="button" id="downloadOverviewCsvBtn" class="pageActionsItem">Descargar CSV</button>
                    <button type="button" id="overviewInformeBtn" class="pageActionsItem">Descargar informe (PDF)</button>
                </div>
            </div>
        </div>
    </div>

    <div class="metricasChartCard metricasTableCard">
        <table class="metricasTable" id="overviewTable">
            <thead>
                <tr>
                    <th class="mThSort" data-sortkey="sidebarOrder">#<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="nombre">Nombre<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="assetType">Tipo<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="participaciones">Posición<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="promedioCompra">Precio medio<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="overviewCurrentPrice">Valor actual<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="invertidoBruto">Inversión bruta<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="comisiones">Comisiones<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="invertidoNeto">Inversión neta<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="overviewCurrentValue">Neto actual<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="overviewYieldValue">Rendimiento €<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="yieldPctVal">Rendimiento %<span class="mSortArrow"></span></th>
                </tr>
            </thead>
            <tbody id="overviewTableBody"></tbody>
        </table>
    </div>

    <p class="overviewEmpty hidden" id="overviewEmptyState">No hay activos para mostrar con los filtros seleccionados.</p>
</section>
