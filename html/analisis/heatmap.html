<div class="heatmapPage">

    <div class="heatmapToolbar">

        <div class="hmGroup" id="heatmapPeriods">
            <button class="hmGroupBtn active" data-period="dia">Día</button>
            <button class="hmGroupBtn" data-period="semana">Semana</button>
            <button class="hmGroupBtn" data-period="mes">Mes</button>
            <button class="hmGroupBtn" data-period="anyo">Año</button>
            <button class="hmGroupBtn" data-period="ytd">YTD</button>
        </div>

        <div class="hmGroup hmGroupToggle" id="heatmapMetric">
            <button class="hmGroupBtn" data-metric="activos">Activos</button>
            <button class="hmGroupBtn active" data-metric="cuenta">Cuenta</button>
        </div>

        <div class="hmGroup hmGroupMulti" id="heatmapTypes">
            <button class="hmGroupBtn active" data-type="all">Todos</button>
            <button class="hmGroupBtn" data-type="cripto">Cripto</button>
            <button class="hmGroupBtn" data-type="acciones">Acciones</button>
            <button class="hmGroupBtn" data-type="etfs">ETFs</button>
            <button class="hmGroupBtn" data-type="comoditis">Comoditis</button>
        </div>

    </div>

    <div class="heatmapWrapper" id="heatmapWrapper">
        <div class="heatmapContainer" id="heatmapContainer">
            <div class="heatmapLoading" id="heatmapLoading">Cargando datos...</div>
        </div>
    </div>

</div>
