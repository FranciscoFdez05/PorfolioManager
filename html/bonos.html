<div class="bonosPage">

    <div class="bonosToolbar">
        <button id="bonosAddBtn" class="primaryButton">+ Añadir bono</button>

        <div class="bonosFilters" id="bonosFilters">
            <button class="bonosFilterBtn active" data-tipo="all">Todos</button>
            <button class="bonosFilterBtn" data-tipo="gubernamental">Gubernamentales</button>
            <button class="bonosFilterBtn" data-tipo="corporativo">Corporativos</button>
        </div>

        <button id="saveBonosBtn" class="primaryButton">Guardar</button>
    </div>

    <div class="bonosSummary">
        <div class="bonosSummaryCard">
            <span class="bonosSummaryLabel">Total neto</span>
            <span class="bonosSummaryValue" id="bonosTotalNeto">0,00 €</span>
        </div>
        <div class="bonosSummaryCard">
            <span class="bonosSummaryLabel">Interés acumulado</span>
            <span class="bonosSummaryValue" id="bonosTotalInteres">0,00 €</span>
        </div>
        <div class="bonosSummaryCard">
            <span class="bonosSummaryLabel">Impuestos</span>
            <span class="bonosSummaryValue" id="bonosTotalImpuestos">0,00 €</span>
        </div>
        <div class="bonosSummaryCard">
            <span class="bonosSummaryLabel">Invertido total</span>
            <span class="bonosSummaryValue" id="bonosTotalInvertido">0,00 €</span>
        </div>
        <div class="bonosSummaryCard bonosSummaryGub">
            <span class="bonosSummaryLabel">Gubernamentales neto</span>
            <span class="bonosSummaryValue" id="bonosTotalGub">0,00 €</span>
        </div>
        <div class="bonosSummaryCard bonosSummaryCorp">
            <span class="bonosSummaryLabel">Corporativos neto</span>
            <span class="bonosSummaryValue" id="bonosTotalCorp">0,00 €</span>
        </div>
    </div>

    <div class="bonosTableWrapper">
        <table class="bonosTable">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Tipo</th>
                    <th>Instrumento</th>
                    <th>Cupón %</th>
                    <th>Vencimiento</th>
                    <th>Invertido</th>
                    <th>Interés acum.</th>
                    <th>Impuestos</th>
                    <th>Total neto</th>
                    <th class="rowActionsCell"></th>
                </tr>
            </thead>
            <tbody id="bonosBody"></tbody>
        </table>
    </div>

    <p class="bonosEmpty hidden" id="bonosEmpty">No hay bonos registrados. Añade uno con el botón superior.</p>

</div>
