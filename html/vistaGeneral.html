<section class="overviewPage">
    <div class="overviewFiltersBar">
        <div class="overviewFilters" id="overviewFilters">
            <label class="overviewFilterOption">
                <input type="checkbox" value="cripto" checked>
                <span>Cripto</span>
            </label>
            <label class="overviewFilterOption">
                <input type="checkbox" value="acciones" checked>
                <span>Acciones</span>
            </label>
            <label class="overviewFilterOption">
                <input type="checkbox" value="etfs" checked>
                <span>ETFs</span>
            </label>
            <label class="overviewFilterOption">
                <input type="checkbox" value="comoditis" checked>
                <span>Comoditis</span>
            </label>
        </div>

        <button id="refreshOverviewMarketBtn" class="primaryButton" type="button">Actualizar cotizaciones</button>
    </div>

    <div class="metricasChartCard metricasTableCard">
        <table class="metricasTable" id="overviewTable">
            <thead>
                <tr>
                    <th class="mThSort" data-sortkey="sidebarOrder">#<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="nombre">Nombre<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="assetType">Tipo<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="participaciones">Posición<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="promedioCompra">P. medio<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="overviewCurrentPrice">Valor actual<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="invertidoBruto">Inv. bruto<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="comisiones">Comis.<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="invertidoNeto">Inv. neto<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="overviewCurrentValue">Neto actual<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="overviewYieldValue">Rend. €<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="yieldPctVal">Rend. %<span class="mSortArrow"></span></th>
                </tr>
            </thead>
            <tbody id="overviewTableBody"></tbody>
        </table>
    </div>

    <p class="overviewEmpty hidden" id="overviewEmptyState">No hay activos para mostrar con los filtros seleccionados.</p>
</section>
