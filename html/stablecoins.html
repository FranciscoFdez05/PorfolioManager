<section class="operationsPage operationsPageCompact stablecoinsPage">
    <div class="stablecoinsHeaderPanel">
        <div class="stablecoinsHeaderCopy">
            <p class="transaccionesAssetPanelLabel">Stablecoins</p>
            <h3 class="transaccionesAssetPanelTitle">Controla compras y ventas de stablecoins elegidas desde Finnhub</h3>
        </div>
        <div class="stablecoinsHeaderTools">
            <button id="openStablecoinModalBtn" class="secondaryButton stablecoinsCompactBtn" type="button">Añadir stablecoin</button>
            <div id="stablecoinsEnabledMenu" class="stablecoinsEnabledMenu"></div>
        </div>
    </div>

    <div id="stablecoinsSummary" class="stablecoinsSummary"></div>

    <div class="operationsTableWrapper stablecoinsTableWrapper">
        <table class="operationsTable stablecoinsTable">
            <thead>
                <tr>
                    <th class="mThSort" data-sortkey="0">Stablecoin<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="1">Fecha<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="2">Tipo<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="3">Divisa fiat<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="4">Cantidad<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="5">Precio unitario<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="6">Total fiat<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="7">Comisiones<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="8">Nota<span class="mSortArrow"></span></th>
                    <th class="rowActionsCell"></th>
                </tr>
            </thead>
            <tbody id="stablecoinsBody"></tbody>
        </table>
    </div>
</section>

<div class="operationsActions">
    <button id="addStablecoinRowBtn" class="primaryButton" type="button">Añadir fila</button>
    <button id="saveStablecoinsBtn" class="secondaryButton" type="button">Guardar</button>
</div>

<div class="modalOverlay hidden" id="stablecoinModalOverlay">
    <div class="assetModal stablecoinModal" role="dialog" aria-modal="true" aria-labelledby="stablecoinModalTitle">
        <h3 class="assetModalTitle" id="stablecoinModalTitle">Añadir stablecoin</h3>
        <label class="assetModalLabel" for="stablecoinSearchInput">Nombre o ticker en Finnhub</label>
        <input id="stablecoinSearchInput" class="assetModalInput" type="text" placeholder="Ej: USDT o Tether">
        <div class="assetModalActions stablecoinModalActions">
            <button id="stablecoinSearchBtn" class="primaryButton" type="button">Buscar</button>
            <button id="closeStablecoinModalBtn" class="secondaryButton" type="button">Cerrar</button>
        </div>
        <p id="stablecoinSearchFeedback" class="assetSearchFeedback hidden"></p>
        <div id="stablecoinSearchResults" class="assetSearchResults hidden"></div>
    </div>
</div>
