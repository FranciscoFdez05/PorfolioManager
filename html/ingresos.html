<section class="ingresosPage">
    <div class="ingresosYearBar">
        <div class="ingresosYearList" id="ingresosYearList"></div>
        <div class="pageActionsMenu" id="ingresosActionsMenu">
            <button class="pageActionsMenuTrigger" type="button" aria-label="Opciones" aria-haspopup="true">···</button>
            <div class="pageActionsDropdown" id="ingresosActionsDropdown">
                <button id="addIngresosYearBtn" class="pageActionsItem" type="button">Añadir año</button>
                <button id="deleteIngresosYearBtn" class="pageActionsItem pageActionsItemDanger" type="button">Eliminar año</button>
                <div class="pageActionsDivider"></div>
                <button id="addIngresoTypeRowBtn" class="pageActionsItem" type="button">Añadir ingreso</button>
                <button id="addRecurrenteRowBtn" class="pageActionsItem" type="button">Añadir recurrente</button>
            </div>
        </div>
    </div>

    <div class="ingresosMonthBar">
        <div class="ingresosMonthTabs" id="ingresosMonthTabs"></div>
        <div class="ingresosMonthActions">
            <button id="sortIngresosByDateBtn" class="secondaryButton hidden" type="button">Ordenar por fecha ↑</button>
        </div>
    </div>

    <div class="ingresosAnnualWrapper" id="ingresosAnnualWrapper">
        <table class="ingresosAnnualTable">
            <thead>
                <tr>
                    <th id="ingresosAnnualYearLabel">2026</th>
                    <th>Enero</th>
                    <th>Febrero</th>
                    <th>Marzo</th>
                    <th>Abril</th>
                    <th>Mayo</th>
                    <th>Junio</th>
                    <th>Julio</th>
                    <th>Agosto</th>
                    <th>Septiembre</th>
                    <th>Octubre</th>
                    <th>Noviembre</th>
                    <th>Diciembre</th>
                    <th class="rowActionHeader"></th>
                </tr>
            </thead>
            <tbody id="ingresosAnnualBody"></tbody>
        </table>
    </div>

    <div class="ingresosMonthHeader hidden" id="ingresosMonthHeader"></div>

    <div class="ingresosMovementsWrapper hidden" id="ingresosMovementsWrapper">
        <table class="ingresosMovementsTable">
            <thead>
                <tr>
                    <th class="mThSort" data-sortkey="0">Fecha<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="1">Nombre<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="2">Tipo<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="3">Cantidad<span class="mSortArrow"></span></th>
                    <th class="rowActionHeader"></th>
                </tr>
            </thead>
            <tbody id="ingresosMovementsBody"></tbody>
        </table>
    </div>

    <div class="ingresosActions hidden" id="ingresosActions">
        <button id="addIngresoRowBtn" class="primaryButton" type="button">Añadir fila</button>
    </div>
</section>
