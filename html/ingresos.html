<section class="ingresosPage">
    <div class="ingresosYearBar">
        <div class="ingresosYearList" id="ingresosYearList"></div>
        <button class="ingresosMonthTab ingresosRecurrentesTab" id="ingresosRecurrentesTabBtn" type="button">Recurrentes</button>
        <div class="pageActionsMenu" id="ingresosActionsMenu">
            <button class="pageActionsMenuTrigger" type="button" aria-label="Opciones" aria-haspopup="true">···</button>
            <div class="pageActionsDropdown" id="ingresosActionsDropdown">
                <button id="addIngresosYearBtn" class="pageActionsItem" type="button">Añadir año</button>
                <button id="deleteIngresosYearBtn" class="pageActionsItem pageActionsItemDanger" type="button">Eliminar año</button>
                <div class="pageActionsDivider"></div>
                <button id="addIngresoTypeRowBtn" class="pageActionsItem" type="button">Añadir ingreso</button>
                <button id="addRecurrenteRowBtn" class="pageActionsItem" type="button">Añadir ganancia recurrente</button>
                <button id="downloadIngresosCsvBtn" class="pageActionsItem" type="button">Descargar CSV</button>
            </div>
        </div>
    </div>

    <div class="ingresosKpiStrip" id="ingresosKpiStrip">
        <div class="ingresosKpiCard">
            <div class="ingresosKpiIcon ingresosKpiIconTotal">€</div>
            <div class="ingresosKpiBody">
                <span class="ingresosKpiLabel">Total año</span>
                <span class="ingresosKpiValue" id="ingresosKpiTotalAnio">---</span>
            </div>
        </div>
        <div class="ingresosKpiCard">
            <div class="ingresosKpiIcon ingresosKpiIconPromedio">Ø</div>
            <div class="ingresosKpiBody">
                <span class="ingresosKpiLabel">Promedio mensual</span>
                <span class="ingresosKpiValue" id="ingresosKpiPromedio">---</span>
            </div>
        </div>
        <div class="ingresosKpiCard">
            <div class="ingresosKpiIcon ingresosKpiIconMejor">▲</div>
            <div class="ingresosKpiBody">
                <span class="ingresosKpiLabel">Mejor mes</span>
                <span class="ingresosKpiValue" id="ingresosKpiMejorMes">---</span>
                <span class="ingresosKpiSub" id="ingresosKpiMejorMesLabel"></span>
            </div>
        </div>
        <div class="ingresosKpiCard">
            <div class="ingresosKpiIcon ingresosKpiIconActual">●</div>
            <div class="ingresosKpiBody">
                <span class="ingresosKpiLabel">Mes actual</span>
                <span class="ingresosKpiValue" id="ingresosKpiMesActual">---</span>
                <span class="ingresosKpiSub" id="ingresosKpiMesActualLabel"></span>
            </div>
        </div>
    </div>

    <div class="ingresosMonthBar">
        <div class="ingresosMonthTabs" id="ingresosMonthTabs"></div>
    </div>

    <section class="recPanel hidden" id="ingresosRecurrentesWrapper">
        <div class="recSummary" id="recSummary"></div>

        <div class="recToolbar">
            <input id="recSearchInput" class="recSearchInput" type="search" placeholder="Buscar por nombre o categoría…" autocomplete="off">
            <div class="recFilterGroup" id="recFilterGroup">
                <button type="button" class="recFilterChip active" data-rec-filter="todas">Todas</button>
                <button type="button" class="recFilterChip" data-rec-filter="activas">Activas</button>
                <button type="button" class="recFilterChip" data-rec-filter="pausadas">Pausadas</button>
            </div>
            <button id="recAddBtn" class="primaryButton recAddBtn" type="button">+ Nueva ganancia recurrente</button>
        </div>

        <div class="recTableWrapper">
            <table class="recTable">
                <thead>
                    <tr>
                        <th class="recColName">Concepto</th>
                        <th>Importe</th>
                        <th>Frecuencia</th>
                        <th>Cobro</th>
                        <th>Próximo cobro</th>
                        <th>Ingreso mensual</th>
                        <th>Ingreso anual</th>
                        <th>Estado</th>
                        <th class="rowActionHeader"></th>
                    </tr>
                </thead>
                <tbody id="recTableBody"></tbody>
                <tfoot id="recTableFoot"></tfoot>
            </table>
        </div>
    </section>

    <div class="ingresosAnnualWrapper" id="ingresosAnnualWrapper">
        <table class="ingresosAnnualTable">
            <thead>
                <tr>
                    <th id="ingresosAnnualYearLabel">2026</th>
                    <th>Enero</th>
                    <th>Febrero</th>
                    <th>Marzo</th>
                    <th>Abril</th>
                    <th>Mayo</th>
                    <th>Junio</th>
                    <th>Julio</th>
                    <th>Agosto</th>
                    <th>Septiembre</th>
                    <th>Octubre</th>
                    <th>Noviembre</th>
                    <th>Diciembre</th>
                    <th class="rowActionHeader"></th>
                </tr>
            </thead>
            <tbody id="ingresosAnnualBody"></tbody>
        </table>
    </div>

    <div class="ingresosMonthHeader hidden" id="ingresosMonthHeader"></div>

    <div class="ingresosMovementsWrapper hidden" id="ingresosMovementsWrapper">
        <table class="ingresosMovementsTable">
            <thead>
                <tr>
                    <th class="mThSort" data-sortkey="0">Fecha<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="1">Nombre<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="2">Tipo<span class="mSortArrow"></span></th>
                    <th class="mThSort" data-sortkey="3">Cantidad<span class="mSortArrow"></span></th>
                    <th class="rowActionHeader"></th>
                </tr>
            </thead>
            <tbody id="ingresosMovementsBody"></tbody>
        </table>
    </div>

    <div class="ingresosActions hidden" id="ingresosActions">
        <button id="addIngresoRowBtn" class="primaryButton" type="button">Añadir fila</button>
    </div>
</section>
