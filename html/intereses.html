<div class="interesesLayout">
    <div class="interesesActions">
        <button id="addRowBtn" class="primaryButton">Añadir fila</button>
    </div>

    <div class="interesesMainArea">
        <div class="interesesTableSection">
            <div class="interesesTableWrapper">
                <table class="interesesTable">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Acumulado</th>
                            <th>Impuestos</th>
                            <th>Total</th>
                            <th class="rowActionHeader"></th>
                        </tr>
                    </thead>
                    <tbody id="interesesBody"></tbody>
                </table>
            </div>
        </div>

        <div class="interesesSummarySection">
            <div class="summaryCard summaryCardTotal">
                <div class="summaryCardTitle">Total</div>
                <div class="summaryCardValue" id="totalResumen">0,00 €</div>
            </div>

            <div class="summaryCard summaryCardTax">
                <div class="summaryCardTitle">Impuestos</div>
                <div class="summaryCardValue" id="impuestosResumen">0,00 €</div>
            </div>
        </div>
    </div>
</div>
