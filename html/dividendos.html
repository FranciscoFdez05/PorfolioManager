<div class="dividendosLayout">
    <div class="interesesYearBar">
        <div class="interesesYearList" id="dividendosYearList"></div>
    </div>

    <div class="dividendosMainArea">
        <div class="dividendosTableSection">
            <div class="dividendosTableWrapper">
                <table class="dividendosTable">
                    <thead>
                        <tr>
                            <th class="mThSort" data-sortkey="0">Fecha<span class="mSortArrow"></span></th>
                            <th class="mThSort" data-sortkey="1">Instrumento<span class="mSortArrow"></span></th>
                            <th class="mThSort" data-sortkey="2">Acciones<span class="mSortArrow"></span></th>
                            <th class="mThSort" data-sortkey="3">Dividendos / Acción<span class="mSortArrow"></span></th>
                            <th class="mThSort" data-sortkey="4">Impuestos<span class="mSortArrow"></span></th>
                            <th class="mThSort" data-sortkey="5">Total<span class="mSortArrow"></span></th>
                            <th class="rowActionHeader"></th>
                        </tr>
                    </thead>
                    <tbody id="dividendosBody"></tbody>
                </table>
            </div>
        </div>

        <div class="dividendosSummarySection">
            <button id="openCalendarioDividendosBtn" class="primaryButton dividendosCalBtn">Calendario Dividendos</button>

            <div class="summaryCard summaryCardTotal">
                <div class="summaryCardTitle">Total dividendos</div>
                <div class="summaryCardValue" id="totalDividendosResumen">0,00 €</div>
            </div>

            <div class="summaryCard summaryCardTax">
                <div class="summaryCardTitle">Impuestos</div>
                <div class="summaryCardValue" id="impuestosDividendosResumen">0,00 €</div>
            </div>
        </div>
    </div>

    <div class="dividendosActions">
        <button id="addRowDividendoBtn" class="primaryButton" type="button">Añadir fila</button>
        <div style="margin-left:auto;display:flex;gap:10px">
            <button id="addDividendosYearBtn" class="secondaryButton" type="button">+ Año</button>
            <button id="deleteDividendosYearBtn" class="dangerButton" type="button">Eliminar año</button>
        </div>
    </div>
</div>
