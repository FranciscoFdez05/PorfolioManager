services:
  portfolio:
    build: .
    env_file: .env
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/login')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
