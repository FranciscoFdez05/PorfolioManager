services:
  porfoliopython:
    container_name: porfoliopython
    build: .
    env_file: .env
    environment:
      # Sobrescribe el PORT de .env con el que exporta docker-up.sh
      # (leído de config.ini), para que el contenedor y el mapeo de
      # puertos de abajo nunca puedan desincronizarse.
      - PORT=${PORT:-5000}
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # API/ va montado (y en escritura) porque las claves que se guardan desde
      # Ajustes acaban en API/*.key: sin volumen se perderían en cada rebuild.
      - ./API:/app/API
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ.get('PORT', '5000') + '/login')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
