<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Manager</title>
    <link rel="stylesheet" href="css/portfolio.css">
</head>
<body>

<div class="appContainer">

    <!-- Menu superioir -->
    <div class="leftWrapper">
        <header class="topBar">
            <h2 class="brand">Portfolio</h2>

            <div class="metrics">
                <div class="metricBox">
                    <span class="metricTitle">Total Cuenta</span>
                    <span class="metricValue" id="topTotalCuenta">---</span>
                </div>

                <div class="metricBox">
                    <span class="metricTitle">% cuenta</span>
                    <span class="metricValue" id="topPorcentajeCuenta">---</span>
                </div>

                <div class="metricBox">
                    <span class="metricTitle">Invertido</span>
                    <span class="metricValue" id="topInvertido">---</span>
                </div>

                <div class="metricBox">
                    <span class="metricTitle">€ dividendos</span>
                    <span class="metricValue" id="topTotalDividendos">0,00 €</span>
                </div>

                <div class="metricBox">
                    <span class="metricTitle">€ Interés</span>
                    <span class="metricValue" id="topTotalInteres">0,00 €</span>
                </div>

                <div class="metricBox">
                    <span class="metricTitle">% cripto</span>
                    <span class="metricValue" id="topPorcentajeCripto">---</span>
                </div>

                <div class="metricBox">
                    <span class="metricTitle">€ cripto</span>
                    <span class="metricValue" id="topEurosCripto">---</span>
                </div>

                <div class="metricBox">
                    <span class="metricTitle">% acciones</span>
                    <span class="metricValue" id="topPorcentajeAcciones">---</span>
                </div>

                <div class="metricBox">
                    <span class="metricTitle">€ acciones</span>
                    <span class="metricValue" id="topEurosAcciones">---</span>
                </div>

                <div class="metricBox">
                    <span class="metricTitle">% ETF</span>
                    <span class="metricValue" id="topPorcentajeEtf">---</span>
                </div>

                <div class="metricBox">
                    <span class="metricTitle">€ ETF</span>
                    <span class="metricValue" id="topEurosEtf">---</span>
                </div>

                <div class="metricBox">
                    <span class="metricTitle">% comoditis</span>
                    <span class="metricValue" id="topPorcentajeComoditis">---</span>
                </div>

                <div class="metricBox">
                    <span class="metricTitle">€ comoditis</span>
                    <span class="metricValue" id="topEurosComoditis">---</span>
                </div>
            </div>
        </header>

        <!-- Botones -->
        <nav class="tabs">
            <div class="searchContainer">
                <input type="text" placeholder="Buscar activo...">
            </div>

            <div class="navButtons">
                <button class="navBtn active" data-page="vistaGeneral">Vista general</button>
                <button class="navBtn" data-page="intereses">Intereses</button>
                <button class="navBtn" data-page="dividendos">Dividendos</button>
                <button class="navBtn" data-page="ingresos">Ingresos</button>
                <button class="navBtn" data-page="gastos">Gastos</button>
                <button class="navBtn" data-page="ventas">Ventas</button>
                <button class="navBtn" data-page="operaciones">Operaciones</button>
                <button class="navBtn" data-page="transacciones">Transacciones</button>
                <button class="navBtn" data-page="herramientas">Herramientas</button>
                <button class="navBtn" data-page="metricas">Métricas</button>
            </div>
        </nav>

        <main class="mainContent">
            <section id="dynamicContent" class="contentArea"></section>
        </main>
    </div>


    <!-- Menu lateral -->
    <div class="sideWrapper" id="sideWrapper">
        <button id="togglePanel" class="toggleButton">▶</button>

        <aside class="sidePanel" id="sidePanel">
            <div class="assetToolbar">
                <button id="addAssetBtn" class="primaryButton assetAddBtn">Añadir activo</button>
            </div>

            <div class="assetsList" id="assetsList"></div>

            <div class="assetDetailView">
                <div class="detailHeader" id="detSymbol">---</div>
                <div class="detailSub" id="detName">Selecciona un activo</div>
            </div>
        </aside>
    </div>

</div>

<div class="modalOverlay hidden" id="assetModalOverlay">
    <div class="assetModal" role="dialog" aria-modal="true" aria-labelledby="assetModalTitle">
        <h3 class="assetModalTitle" id="assetModalTitle">Nuevo activo</h3>

        <label class="assetModalLabel" for="assetNameInput">Nombre del activo</label>
        <input id="assetNameInput" class="assetModalInput" type="text" placeholder="Ej: Microsoft o Solana">

        <label class="assetModalLabel" for="assetTypeSelect">Tipo del activo</label>
        <select id="assetTypeSelect" class="assetModalSelect">
            <option value="cripto">Cripto</option>
            <option value="acciones">Acciones</option>
            <option value="etfs">ETFs</option>
            <option value="comoditis">Comoditis</option>
        </select>

        <div class="assetModalActions">
            <button id="confirmAssetModalBtn" class="primaryButton">Confirmar</button>
            <button id="cancelAssetModalBtn" class="secondaryButton">Cancelar</button>
        </div>
    </div>
</div>

<div class="modalOverlay hidden" id="confirmModalOverlay">
    <div class="assetModal" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
        <h3 class="assetModalTitle" id="confirmModalTitle">Confirmar acción</h3>
        <p class="assetModalMessage" id="confirmModalMessage">¿Seguro que quieres continuar?</p>

        <div class="assetModalActions confirmModalActions">
            <button id="confirmModalAcceptBtn" class="dangerButton">Eliminar</button>
            <button id="confirmModalCancelBtn" class="secondaryButton">Cancelar</button>
        </div>
    </div>
</div>

<script src="js/app-core.js"></script>
<script src="js/assets.js"></script>
<script src="js/intereses.js"></script>
<script src="js/dividendos.js"></script>
<script src="js/shared-utils.js"></script>
</body>
</html>
