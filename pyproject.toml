[project]
name = "porfoliomanager"
# La versión canónica está en python/core/version.py, que es de donde la lee la
# aplicación. Aquí se repite porque las herramientas del ecosistema la esperan;
# tests/test_version.py comprueba que las dos no se separen.
version = "1.1.1"
description = "Seguimiento local de una cartera de inversión personal (Flask + SQLite)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
keywords = ["portfolio", "inversión", "fifo", "irpf", "finanzas", "sqlite", "flask"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Repositorio = "https://github.com/FranciscoFdez05/PorfolioManager"
Cambios = "https://github.com/FranciscoFdez05/PorfolioManager/blob/main/CHANGELOG.md"
Incidencias = "https://github.com/FranciscoFdez05/PorfolioManager/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
# El código vive en python/ y se importa de forma plana (`from app_data import …`),
# igual que hace gunicorn con --chdir python. Sin esto los tests no resolverían
# los módulos.
pythonpath = ["python"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "network: pruebas que salen a internet (desactivadas en CI)",
]

[tool.coverage.run]
source = ["python"]
branch = true
omit = [
    # server.py se excluye porque la suite tiene prohibido importarlo: al
    # importarse ejecuta init_portfolios() y ensureDataFile(), que escriben
    # sobre los datos reales de quien lance los tests. Lo que sí importaba de
    # ese módulo —CSRF, sesión, límite de escrituras, cabeceras— vive ahora en
    # core/seguridad_app.py, y eso sí está cubierto.
    "python/server.py",
    # Clientes HTTP de los proveedores de mercado: son casi enteramente
    # peticiones a APIs externas y el parseo de sus respuestas. Sus pruebas
    # están marcadas `network` y CI las salta, así que contarlos aquí solo
    # bajaría el umbral hasta volverlo inútil. El código propio que los rodea
    # (providers/http.py, providers/text.py) sí cuenta.
    "python/providers/finnhub_client.py",
    "python/providers/yahoo_finance_client.py",
    "python/providers/eodhd_client.py",
    "python/providers/alpha_vantage_client.py",
]

[tool.coverage.report]
# El umbral no es una meta, es un trinquete: sube cuando suba la cobertura y
# sirve para que un PR no la baje sin que nadie se dé cuenta. Se deja un par de
# puntos por debajo del valor actual (~62% con cobertura de ramas) para que un
# refactor que mueva código no rompa CI por décimas.
#
# Este número es el del proyecto entero, y mezcla un cliente HTTP con el cálculo
# de la declaración de la renta. Los módulos donde un error cuesta dinero tienen
# su propio umbral, mucho más alto, en un paso aparte del workflow de CI.
fail_under = 60
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".claude", "data", "logs", "API"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes: nombres sin definir, imports sin usar
    "W",    # warnings
    "I",    # orden de imports
    "B",    # bugbear: fallos reales (mutables por defecto, except inútiles…)
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplificaciones
    "RUF",  # reglas propias de ruff
]
ignore = [
    # El proyecto usa camelCase en las funciones de rutas y stores por
    # coherencia con el frontend; renombrarlo sería un cambio masivo sin valor.
    "N802", "N803", "N806",
    # `except Exception` es deliberado en los puntos donde un fallo de un
    # proveedor externo no debe tumbar la petición completa.
    "BLE001",
    # La longitud de línea la decide `ruff format`, no el linter: marcar aquí
    # tablas de datos y literales largos solo genera ruido.
    "E501",
    # `try/except: pass` explícito se lee mejor que contextlib.suppress en las
    # limpiezas de conexiones y ficheros temporales de este código.
    "SIM105",
    "SIM108",  # el ternario no siempre es más legible aquí
    # Los `if` anidados de las funciones de puntuación de símbolos expresan
    # niveles de decisión distintos; colapsarlos los hace ilegibles.
    "SIM102",
]

[tool.ruff.lint.per-file-ignores]
# server.py registra los tipos MIME antes de importar Flask a propósito: si se
# importa primero, Werkzeug cachea el mapa de mimetypes de Windows y sirve los
# .js con el Content-Type equivocado.
"python/server.py" = ["E402"]
# Los tests declaran conjuntos de opciones como atributos de clase.
"tests/*" = ["RUF012"]

[tool.ruff.lint.isort]
# Sin esto, los imports con alias (`from market import fetch_json,
# format_decimal as _format_decimal`) se parten en un bloque `from market
# import (...)` por cada alias.
combine-as-imports = true
known-first-party = ["admin", "core", "providers", "routes", "server", "stores"]
